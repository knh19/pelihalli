<title>Highway Rush</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Saira+Condensed:wght@500;700;800&family=Saira:wght@400;600&display=swap">
<style>
/* Layout: full-screen 3D canvas; motorsport HUD pinned to the corners; garage-style menu over a dimmed live scene */
:root{
  color-scheme:dark;
  --bg:#0a0d13;           /* asphalt night */
  --panel:#131823ee;
  --line:#2a3242;
  --fg:#eef1f6;
  --muted:#8a94a8;
  --accent:#ffb21f;       /* autobahn sign amber */
  --danger:#ff3b3b;
  --ok:#35d07f;
  --nitro:#3fb6ff;
  --display:"Saira Condensed","Arial Narrow",Arial,sans-serif;
  --body:"Saira","Segoe UI",system-ui,Arial,sans-serif;
}
html,body{height:100%}
body{margin:0;overflow:hidden;background:var(--bg);color:var(--fg);font-family:var(--body);user-select:none}
canvas{display:block;outline:none}
button{font-family:var(--display);cursor:pointer}
button:focus-visible,.opt:focus-visible{outline:2px solid var(--fg);outline-offset:2px}

#menu{position:fixed;inset:0;z-index:20;overflow:auto;background:radial-gradient(120% 90% at 50% 0%,#1b2333 0%,var(--bg) 70%);
  padding-block:max(24px,env(safe-area-inset-top,0px)) 24px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:980px;margin:0 auto;display:flex;flex-direction:column;gap:22px}
.brand{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap}
.brand h1{font-family:var(--display);font-weight:800;font-style:italic;font-size:clamp(44px,9vw,84px);letter-spacing:.02em;margin:0;line-height:1.05;padding-top:.05em;text-wrap:balance}
.brand h1 span{color:var(--accent)}
.brand p{margin:0;color:var(--muted);font-size:14px;letter-spacing:.12em;text-transform:uppercase}
.sec h2{font-family:var(--display);font-weight:700;font-size:15px;letter-spacing:.22em;text-transform:uppercase;color:var(--muted);margin:0 0 10px}
.grid{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
.opt{background:var(--panel);border:1.5px solid var(--line);border-radius:6px;padding:12px 14px;cursor:pointer;display:flex;flex-direction:column;gap:6px;text-align:left;color:var(--fg);font-family:var(--body);min-width:0}
.opt:hover{border-color:#4a5468}
.opt.sel{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.opt b{font-family:var(--display);font-size:20px;font-weight:700;letter-spacing:.03em}
.opt small{color:var(--muted);font-size:12.5px}
.sw{height:46px;border-radius:3px}
.stat{display:grid;grid-template-columns:62px 1fr;align-items:center;gap:8px;font-size:11px;color:var(--muted);letter-spacing:.08em;text-transform:uppercase}
.bar{height:5px;background:#252c3a;border-radius:3px;overflow:hidden}.bar i{display:block;height:100%;background:var(--accent)}
.paints{display:flex;gap:10px;flex-wrap:wrap}.paint{width:38px;height:38px;border-radius:50%;border:2px solid var(--line);cursor:pointer;padding:0}.paint.sel{border-color:var(--fg);box-shadow:0 0 0 3px var(--accent)}
.best{color:var(--accent);font-family:var(--display);font-size:14px;letter-spacing:.05em}
#hGear{font-family:var(--display);font-weight:700;font-size:22px;color:var(--muted)}
.go{display:flex;gap:16px;align-items:center;flex-wrap:wrap}
#start{background:var(--accent);color:#111;border:none;border-radius:4px;padding:14px 56px;font-size:26px;font-weight:800;font-style:italic;letter-spacing:.06em}
.keys{color:var(--muted);font-size:13px;line-height:1.7}
kbd{font-family:var(--display);border:1px solid var(--line);border-bottom-width:2px;border-radius:3px;padding:0 6px;color:var(--fg);font-size:13px}

#hud{position:fixed;inset:0;pointer-events:none;z-index:5;text-shadow:0 1px 3px #000,0 0 12px #0009}
#hud .lab{color:#e4e8f0}
.tl{position:absolute;top:calc(14px + env(safe-area-inset-top,0px));left:max(18px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:6px}
.tr{position:absolute;top:calc(14px + env(safe-area-inset-top,0px));right:max(18px,env(safe-area-inset-right,0px));text-align:right;display:flex;flex-direction:column;gap:2px}
.lab{font-family:var(--display);font-size:13px;letter-spacing:.2em;text-transform:uppercase;color:var(--muted)}
.big{font-family:var(--display);font-weight:700;font-size:30px;font-variant-numeric:tabular-nums;line-height:1}

#spd small{font-size:22px;font-style:normal;color:var(--muted);margin-left:6px}

.m{height:8px;background:#00000077;border-radius:4px;overflow:hidden}.m i{display:block;height:100%;width:100%;transition:width .15s}

#count{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--display);font-weight:800;font-style:italic;font-size:160px;text-shadow:0 4px 30px #000}
#flash{position:fixed;inset:0;background:var(--danger);opacity:0;pointer-events:none;z-index:4;transition:opacity .35s}

#over{position:fixed;inset:0;z-index:15;display:grid;place-items:center;background:#05070bcc;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.card{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:26px 30px;min-width:min(380px,100%);display:flex;flex-direction:column;gap:16px}
.card h2{margin:0;font-family:var(--display);font-weight:800;font-style:italic;font-size:46px;line-height:1}
.rows{display:grid;grid-template-columns:1fr auto;gap:6px 24px;font-variant-numeric:tabular-nums}
.rows span:nth-child(odd){color:var(--muted)}
.btns{display:flex;gap:10px;flex-wrap:wrap}
.btns button{flex:1;padding:12px 18px;font-size:20px;font-weight:700;border-radius:4px;border:1.5px solid var(--line);background:transparent;color:var(--fg);letter-spacing:.05em}
.btns button.pri{background:var(--accent);border-color:var(--accent);color:#111}
@media (pointer:coarse){.bl{display:none}#spd{font-size:56px}}
#pad{position:fixed;left:0;right:0;bottom:calc(14px + env(safe-area-inset-bottom,0px));display:flex;justify-content:space-between;padding-left:max(14px,env(safe-area-inset-left,0px));padding-right:max(14px,env(safe-area-inset-right,0px));pointer-events:none;z-index:6}
#pad div{display:flex;gap:10px}
#pad button{pointer-events:auto;width:68px;height:68px;border-radius:50%;border:2px solid #ffffff55;background:#0008;color:#fff;font-size:22px;touch-action:none}
@media (prefers-reduced-motion:reduce){#flash,.m i,#pop{transition:none}}
</style>

  <div class="wrap">
    <div class="brand"><h1>HIGHWAY <span>RUSH</span></h1><p>Reach the exit before the clock runs out</p></div>
    <div class="sec"><h2>Map</h2><div class="grid" id="maps"></div></div>
    <div class="sec"><h2>Car</h2><div class="grid" id="cars"></div></div>

    <div class="sec"><h2>Conditions</h2><div class="grid" id="conds"></div></div>

    <div class="go">
      <button id="start">DRIVE</button>
      <div class="keys"><kbd>W</kbd>/<kbd>↑</kbd> gas · <kbd>S</kbd>/<kbd>↓</kbd> brake · <kbd>A</kbd><kbd>D</kbd>/<kbd>←</kbd><kbd>→</kbd> steer · <kbd>Shift</kbd> nitro · <kbd>C</kbd> camera · <kbd>P</kbd> pause · <kbd>M</kbd> sound</div>
    </div>
  </div>
</div>

<div id="hud" hidden>

  <div class="br">
    <span id="hGear"></span><div id="spd">0<small>km/h</small></div>
    <div class="meters"><span class="lab">Body</span><div class="m" id="hp"><i></i></div><span class="lab">Nitro</span><div class="m" id="nos"><i></i></div></div>
  </div>
  <div class="bl">Shift nitro · C camera · P pause · M sound</div>
  <div id="pop"></div>
  <div id="count"></div>
</div>
<div id="flash"></div>
<div id="pad" hidden><div><button id="bl" aria-label="Steer left">◀</button><button id="br" aria-label="Steer right">▶</button></div><div><button id="bn" aria-label="Nitro">N</button><button id="bb" aria-label="Brake">■</button><button id="bg" aria-label="Gas">▲</button></div></div>

    <h2 id="oT">CRASHED</h2>
    <div class="rows" id="oRows"></div>
    <div class="btns"><button id="oRetry" class="pri">RETRY</button><button id="oMenu">MENU</button></div>
  </div>
</div>

function lerpKeys(keys,z){if(z<=keys[0][0])return keys[0].slice(1);for(let i=1;i<keys.length;i++){if(z<=keys[i][0]){const a=keys[i-1],b=keys[i],t=(z-a[0])/(b[0]-a[0]),s=t*t*(3-2*t);return a.slice(1).map((v,k)=>v+(b[k+1]-v)*s)}}return keys[keys.length-1].slice(1)}

function loft(keys,z0,z1,nz,n,cap){const R=32,pos=[],idx=[];
 for(let i=0;i<=nz;i++){const z=z0+(z1-z0)*i/nz;const [yb,yt,wb,wt]=lerpKeys(keys,z);const ym=(yb+yt)/2,hh=(yt-yb)/2;
  for(let j=0;j<R;j++){const a=j/R*Math.PI*2,c=Math.cos(a),s=Math.sin(a);const px=Math.sign(c)*Math.pow(Math.abs(c),2/n),py=Math.sign(s)*Math.pow(Math.abs(s),2/n);

 if(cap){for(const [ring,flip] of [[0,1],[nz,0]]){const ci=pos.length/3;const [yb,yt]=lerpKeys(keys,ring?z1:z0);pos.push(0,(yb+yt)/2,ring?z1:z0);

const TP={x:[[80,380,0],[30,160,1.3]],y:[[12,350,.7],[4,140,0]]};
const sumF=(arr,s,der)=>arr.reduce((a,[A,L,P])=>a+(der===0?A*Math.sin(s/L+P):der===1?A/L*Math.cos(s/L+P):-A/(L*L)*Math.sin(s/L+P)),0);

const gl=(arr,der)=>arr.map(([A,L,P])=>der?`${(A/L).toFixed(6)}*cos(s/${L.toFixed(1)}+${P.toFixed(2)})`:`${A.toFixed(1)}*sin(s/${L.toFixed(1)}+${P.toFixed(2)})`).join('+');
const BEND_GLSL=`uniform vec4 uBend;
float bCx(float s){return ${gl(TP.x,0)};}
float bCxp(float s){return ${gl(TP.x,1)};}
float bCy(float s){return ${gl(TP.y,0)};}
float bCyp(float s){return ${gl(TP.y,1)};}
vec3 bend(vec3 w){float d=clamp(-w.z,-30.0,520.0);float t=uBend.x;float s=t+d;float k=uBend.y;
 return vec3(k*(bCx(s)-bCx(t)-bCxp(t)*d),k*(bCy(s)-bCy(t)-bCyp(t)*d),0.0);}
`;
const BEND={value:new THREE.Vector4(0,1,0,0)};
