const scene=new THREE.Scene();scene.background=new THREE.Color(0x9fc8e0);scene.fog=new THREE.Fog(0x9fc8e0,40,110);

const hemi=new THREE.HemisphereLight(0xeaf6ff,0x4a6a3a,.85);scene.add(hemi);

function canvasTex(w,h,draw,rep){const c=document.createElement('canvas');c.width=w;c.height=h;draw(c.getContext('2d'),w,h);const t=new THREE.CanvasTexture(c);t.encoding=THREE.sRGBEncoding;t.wrapS=t.wrapT=THREE.RepeatWrapping;if(rep)t.repeat.set(rep[0],rep[1]);t.anisotropy=4;return t;}
const waterTex=canvasTex(256,256,(x,w,h)=>{x.fillStyle='#2f7fa8';x.fillRect(0,0,w,h);for(let i=0;i<70;i++){const y=Math.random()*h,xx=Math.random()*w,l=20+Math.random()*60;x.strokeStyle=`rgba(255,255,255,${.08+Math.random()*.16})`;x.lineWidth=2+Math.random()*2;x.beginPath();x.moveTo(xx,y);x.quadraticCurveTo(xx+6,y+l/2,xx,y+l);x.stroke();}});
const foamTex=canvasTex(256,256,(x,w,h)=>{x.clearRect(0,0,w,h);for(let i=0;i<160;i++){x.fillStyle=`rgba(255,255,255,${.25+Math.random()*.5})`;x.beginPath();x.ellipse(Math.random()*w,Math.random()*h,3+Math.random()*10,2+Math.random()*4,0,0,7);x.fill();}});
const grassTex=canvasTex(256,256,(x,w,h)=>{x.fillStyle='#4f8a3a';x.fillRect(0,0,w,h);for(let i=0;i<2200;i++){x.fillStyle=`rgba(${30+Math.random()*60|0},${90+Math.random()*70|0},${30+Math.random()*30|0},.6)`;x.fillRect(Math.random()*w,Math.random()*h,2,3);}});
const logTex=canvasTex(128,256,(x,w,h)=>{x.fillStyle='#8a5a32';x.fillRect(0,0,w,h);for(let i=0;i<40;i++){x.strokeStyle=`rgba(40,20,5,${.2+Math.random()*.3})`;x.lineWidth=1+Math.random()*2;const xx=Math.random()*w;x.beginPath();x.moveTo(xx,0);x.lineTo(xx+Math.random()*6-3,h);x.stroke();}});

const cx=z=>6*Math.sin(z*.021+RV.s1)+4*Math.sin(z*.052+RV.s2);
const hw=z=>{let w=8+2.6*Math.sin(z*.033+RV.s3);for(const d of RV.docks)if(Math.abs(z-d.z)<9)w+=2*(1-Math.abs(z-d.z)/9);return w;};
const inRap=z=>RV.rap.some(r=>z<r[0]&&z>r[1]);
const curSpd=z=>{let s=2.1+RV.lv*.12;if(inRap(z))s+=2.6;return s;};
function tangent(z){const a=cx(z-1),b=cx(z+1);const dx=(a-b)/2;const l=Math.hypot(dx,1);return{x:dx/l,z:-1/l};}// virtaus kohti -z
function buildRiver(L){if(world){scene.remove(world);world.traverse(o=>{if(o.geometry)o.geometry.dispose();});}world=new THREE.Group();scene.add(world);
  const N=Math.ceil((L+60)/2),pos=[],uv=[],bpos=[],idx=[],bidx=[];
  for(let i=0;i<=N;i++){const z=30-i*2,c=cx(z),w=hw(z);pos.push(c-w-.5,0,z,c+w+.5,0,z);uv.push(0,i*2/9,1,i*2/9);
    const y=.35;bpos.push(c-w-40,y+1.5,z,c-w-1,y,z,c-w+.2,-.6,z,c+w-.2,-.6,z,c+w+1,y,z,c+w+40,y+1.5,z);
    if(i<N){const a=i*2;idx.push(a,a+1,a+2,a+1,a+3,a+2);const b=i*6;for(const k of[0,1,3,4]){if(k===2)continue;bidx.push(b+k,b+k+6,b+k+1,b+k+1,b+k+6,b+k+7);}}}
  const g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.Float32BufferAttribute(pos,3));g.setAttribute('uv',new THREE.Float32BufferAttribute(uv,2));g.setIndex(idx);g.computeVertexNormals();
  const wm=new THREE.MeshStandardMaterial({color:0xffffff,map:waterTex,roughness:.15,metalness:.1,transparent:true,opacity:.92});const water=new THREE.Mesh(g,wm);water.position.y=0;water.receiveShadow=true;world.add(water);
  const fm=new THREE.MeshBasicMaterial({map:foamTex,transparent:true,depthWrite:false,opacity:.85});const foam=new THREE.Mesh(g.clone(),fm);foam.position.y=.03;foam.visible=false;world.add(foam);
  const bg=new THREE.BufferGeometry();bg.setAttribute('position',new THREE.Float32BufferAttribute(bpos,3));const buv=[];for(let i=0;i<bpos.length/3;i++)buv.push(bpos[i*3]/6,bpos[i*3+2]/6);bg.setAttribute('uv',new THREE.Float32BufferAttribute(buv,2));bg.setIndex(bidx);bg.computeVertexNormals();
  const bank=new THREE.Mesh(bg,M(0xffffff,.95,{map:grassTex,side:THREE.DoubleSide}));bank.receiveShadow=true;world.add(bank);
  const bed=new THREE.Mesh(new THREE.PlaneGeometry(120,L+120),M(0x26404a,1));bed.rotation.x=-Math.PI/2;bed.position.set(0,-.7,-L/2);world.add(bed);
  // vaahtoa koskissa
  for(const r of RV.rap){const zs=r[0],ze=r[1];for(let z=zs;z>ze;z-=3){const fo=new THREE.Mesh(new THREE.PlaneGeometry(hw(z)*1.7,2.6),new THREE.MeshBasicMaterial({map:foamTex,transparent:true,depthWrite:false,opacity:.75}));fo.rotation.x=-Math.PI/2;fo.position.set(cx(z),.04,z);world.add(fo);fo.userData.rap=1;}}
  // puut
  const tg=new THREE.ConeGeometry(1.6,4.2,7),tm=M(0x1f4a2a,.95),trunkG=new THREE.CylinderGeometry(.2,.26,1.2,6),trunkM=M(0x5a3a22,.9);
  const nT=Math.floor(L/4),tI=new THREE.InstancedMesh(tg,tm,nT*2),sI=new THREE.InstancedMesh(trunkG,trunkM,nT*2),mm=new THREE.Matrix4(),q=new THREE.Quaternion(),sc=new THREE.Vector3(),p=new THREE.Vector3();let k=0;
  for(let i=0;i<nT;i++)for(const side of[-1,1]){const z=20-i*4-Math.random()*3,c=cx(z),w=hw(z);const x=c+side*(w+3+Math.random()*16),s=.7+Math.random()*.8;
    sc.set(s,s,s);p.set(x,.35+1.5*((Math.abs(x-c)-w)/40)+2.6*s,z);mm.compose(p,q,sc);tI.setMatrixAt(k,mm);p.y-=2.6*s;p.y+=.6*s;mm.compose(p,q,sc);sI.setMatrixAt(k,mm);k++;}
  tI.castShadow=true;tI.count=k;sI.count=k;world.add(tI,sI);
  return{water,foam};}

function makeRaft(){const g=new THREE.Group(),m=M(0xffffff,.85,{map:logTex});
  for(let i=0;i<5;i++){const l=new THREE.Mesh(new THREE.CylinderGeometry(.32,.32,4.2,12),m);l.rotation.x=Math.PI/2;l.position.set(-1.28+i*.64,.12,0);l.castShadow=l.receiveShadow=true;g.add(l);}
  for(const z of[-1.5,1.5]){const b=new THREE.Mesh(new THREE.BoxGeometry(3.3,.12,.25),M(0x5a3a22,.8));b.position.set(0,.42,z);b.castShadow=true;g.add(b);}
  const flag=new THREE.Group();const pole=new THREE.Mesh(new THREE.CylinderGeometry(.04,.04,1.8,6),M(0x4a3a2a,.8));pole.position.y=.9;flag.add(pole);const f=new THREE.Mesh(new THREE.PlaneGeometry(.7,.45),M(0xf2c230,.6,{side:THREE.DoubleSide}));f.position.set(.35,1.55,0);flag.add(f);flag.position.set(1.3,.3,1.8);g.add(flag);
  scene.add(g);return{o:g,x:0,z:0,a:0,vx:0,vz:0,w:0,hp:5,cargo:[],spinAcc:0,flag:f};}
function makePaddle(){const g=new THREE.Group();const s=new THREE.Mesh(new THREE.CylinderGeometry(.03,.03,1.4,6),M(0x8a5a32,.7));s.position.y=.2;g.add(s);const b=new THREE.Mesh(new THREE.BoxGeometry(.2,.4,.04),M(0xc8803a,.6));b.position.y=-.5;g.add(b);return g;}
function makePlayer(i,name){const b=CK.blob({color:i?0x5fd6dc:0xf0b47a,belly:i?0xd8fbff:0xfff0d8,hat:i?'beanie':'cap',hatColor:i?0x2f6fd6:0xc0392b,feet:i?0x2a6a7a:0x6a3a1a});b.scale.setScalar(1.2);scene.add(b);
  const pad=makePaddle();pad.visible=false;b.add(pad);const lab=K.label(name,'cklabel');lab.style.color=i?'#5fe6f0':'#ff9a4a';
  return{i,o:b,pad,lx:i?.7:-.7,lz:.6,x:0,z:0,vx:0,vz:0,face:0,onRaft:true,swimT:0,cd:0,stroke:0,lab,bubble:null,bubT:0};}
function saveMesh(k){const s=SAVE[k],g=new THREE.Group(),add=(geo,m,x,y,z,sx,sy,sz)=>{const o=new THREE.Mesh(geo,m);o.position.set(x,y,z);o.scale.set(sx,sy,sz);o.castShadow=true;g.add(o);return o;},B=new THREE.BoxGeometry(1,1,1),S=CK.SPH;
  switch(k){case'kissa':add(B,M(0xb8925a,.9),0,.2,0,.6,.4,.5);add(S,M(0xf0a030,.6),0,.5,0,.2,.18,.2);for(const q of[-1,1])add(S,M(0xf0a030,.6),q*.1,.66,0,.05,.08,.05);add(S,M(0xffffff,.3),.07,.52,-.17,.04,.04,.03);add(S,M(0xffffff,.3),-.07,.52,-.17,.04,.04,.03);break;
    case'ankat':for(let i=0;i<3;i++){add(S,M(0xf3d23a,.6),(i-1)*.28,.15,(i%2)*.15,.13,.11,.15);add(S,M(0xf3d23a,.6),(i-1)*.28,.28,(i%2)*.15-.08,.08,.08,.08);add(B,M(0xff8a1a,.5),(i-1)*.28,.27,(i%2)*.15-.17,.06,.03,.06);}break;
    case'poro':add(S,M(0x8a6a4a,.8),0,.4,0,.25,.25,.45);add(S,M(0x8a6a4a,.8),0,.65,-.42,.14,.15,.17);for(const q of[-1,1]){add(B,M(0x5a4a3a,.8),q*.1,.88,-.4,.03,.2,.03);}for(const[x,z]of[[-.12,-.25],[.12,-.25],[-.12,.25],[.12,.25]])add(B,M(0x5a4a3a,.8),x,.15,z,.06,.3,.06);break;
    case'mummo':{const t=new THREE.Mesh(new THREE.TorusGeometry(.42,.16,10,20),M(0x222222,.7));t.rotation.x=Math.PI/2;t.position.y=.12;t.castShadow=true;g.add(t);add(S,M(0xd0a0c0,.7),0,.42,0,.25,.3,.24);add(S,M(0xf2d0b0,.6),0,.78,0,.17,.17,.17);add(S,M(0xeeeeee,.9),0,.92,.03,.15,.08,.15);add(S,M(0x111111,.3),.06,.8,-.15,.03,.03,.02);add(S,M(0x111111,.3),-.06,.8,-.15,.03,.03,.02);break;}
    case'kala':add(B,M(0x5a8ab0,.6),0,.2,0,.7,.35,.5);for(let i=0;i<2;i++)add(S,M(0xb0c8d8,.3),(i-.5)*.3,.42,0,.16,.07,.08);break;
    case'kitara':add(B,M(0x2a2a2a,.5),0,.12,0,.4,.2,1.1);add(B,M(0xc0c0c0,.3),0,.23,-.2,.1,.02,.1);break;
    case'sanko':add(new THREE.CylinderGeometry(.22,.17,.36,12),M(0x9a6a3a,.8),0,.18,0,1,1,1);break;
    case'arkku':add(B,M(0x6a4a2a,.8),0,.22,0,.7,.44,.45);add(B,M(0xd8b040,.3),0,.3,-.23,.12,.12,.03);break;}
  return g;}
function makeBear(){const g=new THREE.Group();const fur=M(0x5a3a22,.9),add=(geo,m,x,y,z,sx,sy,sz)=>{const o=new THREE.Mesh(geo,m);o.position.set(x,y,z);o.scale.set(sx,sy,sz);o.castShadow=true;g.add(o);return o;};
  add(CK.SPH,fur,0,.75,0,.7,.62,.95);add(CK.SPH,fur,0,1.15,-.85,.45,.42,.45);add(CK.SPH,M(0xc8a070,.8),0,1.05,-1.22,.2,.15,.15);add(CK.SPH,M(0x111111,.3),0,1.1,-1.36,.07,.06,.05);
  for(const s of[-1,1]){add(CK.SPH,fur,s*.32,1.5,-.78,.13,.13,.08);add(CK.SPH,M(0xffffff,.3),s*.17,1.27,-1.18,.07,.08,.04);add(CK.SPH,M(0x111111,.3),s*.17,1.27,-1.22,.035,.045,.02);}

  scene.add(g);const lab=K.label('ILMARI','cklabel');lab.style.color='#ffd24a';return{o:g,legs,lab};}

let G=null,RVm=null;
function clearLevel(){if(!G)return;for(const o of G.objs)scene.remove(o);for(const p of G.pl){scene.remove(p.o);p.lab.remove();if(p.bubble)p.bubble.remove();}scene.remove(G.raft.o);
  for(const it of G.items){scene.remove(it.o);if(it.lab)it.lab.remove();}for(const b of G.bears){scene.remove(b.m.o);b.m.lab.remove();}const n=document.getElementById('ckRaft');if(n)n.remove();G=null;}
let menuT=0;
function menuScene(){clearLevel();RV={s1:1.3,s2:.4,s3:2,len:400,rap:[[-60,-110]],docks:[],lv:0};RVm=buildRiver(400);hemi.intensity=.85;sun.intensity=1.15;scene.background.setHex(0x9fc8e0);scene.fog.color.setHex(0x9fc8e0);}
function startLevel(n,st){clearLevel();const L=LEVELS[n];const seedVal=(st&&st.seed)||(1+Math.floor(Math.random()*1e6));const rng=mulberry(n*977+seedVal);
  RV={s1:rng()*6,s2:rng()*6,s3:rng()*6,len:L.len,rap:[],docks:[],lv:n};
  for(let i=0;i<L.rap;i++){const z0=-60-(i+.5)*(L.len-100)/L.rap;RV.rap.push([z0,z0-34]);}
  const nd=Math.max(2,Math.round(L.len/130));for(let i=1;i<=nd;i++){const z=-i*L.len/nd+(i===nd?0:10);RV.docks.push({z,side:i%2?1:-1,last:i===nd});}
  RVm=buildRiver(L.len);
  G={n,L,time:L.time,money:0,pl:[],items:[],objs:[],rocks:[],whirls:[],bears:[],dmg:0,docked:{},finished:false,seed:seedVal};
  G.raft=makeRaft();G.raft.z=8;G.raft.x=cx(8);
  for(let i=0;i<K.players;i++)G.pl.push(makePlayer(i,K.names[i]||('P'+(i+1))));

  for(let i=splashes.length-1;i>=0;i--){const s=splashes[i];s.t-=rdt;s.vy-=9*rdt;s.m.position.x+=s.vx*rdt;s.m.position.y+=s.vy*rdt;s.m.position.z+=s.vz*rdt;if(s.t<=0||s.m.position.y<0){scene.remove(s.m);splashes.splice(i,1);}}
  for(let i=floats.length-1;i>=0;i--){const f=floats[i];f.t-=rdt;f.p.y+=rdt*1.2;K.place(f.el,f.p,0);f.el.style.opacity=Math.min(1,f.t*2);if(f.t<=0){f.el.remove();floats.splice(i,1);}}
  if(G){const r=G.raft,bob=Math.sin(T*2.2)*.05;r.o.position.set(r.x,bob,r.z);r.o.rotation.set(Math.sin(T*1.7)*.03,r.a,Math.sin(T*1.3)*.03);r.flag.rotation.y=Math.sin(T*4)*.3;
    for(const p of G.pl){p.o.position.set(p.x,p.onRaft?.38+bob:-.35,p.z);p.o.rotation.y=p.face;CK.animBlob(p.o,rdt*(K.state==='play'?1:0),p.onRaft?Math.hypot(K.inp[p.i].x,K.inp[p.i].z)*3:2,false);
      p.pad.visible=p.stroke>0||(p.onRaft&&Math.abs(p.lx)>.85);if(p.pad.visible){const sd=p.lx>0?1:-1;p.pad.position.set(.45,.55,-.1);p.pad.rotation.set(-(p.stroke>0?Math.sin((1-p.stroke/.35)*Math.PI)*1.2:.2),0,.5);}
      K.place(p.lab,p.o.position,1.7);if(p.bubble)K.place(p.bubble,p.o.position,2.3);}
    camT.x=lerp(camT.x,r.x,Math.min(1,rdt*3));camT.z=lerp(camT.z,r.z-1.2,Math.min(1,rdt*3));
    sun.position.set(camT.x-14,32,camT.z+16);sun.target.position.set(camT.x,0,camT.z);}
  else{menuT+=rdt;camT.x=cx(-menuT*3)||0;camT.z=-menuT*3%300;sun.position.set(camT.x-14,32,camT.z+16);sun.target.position.set(camT.x,0,camT.z);if(RVm)RVm.water.material.map.offset.y+=rdt*.25;}
  shake=Math.max(0,shake-rdt);const sx=(Math.random()-.5)*shake*.7;
  camera.position.set(camT.x+sx,G?13:20,camT.z+(G?9.5:14));camera.lookAt(camT.x,0,camT.z-1.2);
});
menuScene();K.menu();
</script>
