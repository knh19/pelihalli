  else if(d.st==='wander'){if(d.t<=0){d.t=2+Math.random()*3;const p=randFree();d.tx=p.x;d.tz=p.z;}spd*=.45;
    const guard=G.pl.some(p=>Math.hypot(p.x-c.x,p.z-c.z)<2.6);if(c.items.length&&!guard&&Math.random()<dt*.5)d.st='steal';}
  else if(d.st==='steal'){tx=c.x;tz=c.z;if(Math.hypot(d.x-c.x,d.z-c.z)<1.2&&c.items.length){const it=c.items.splice((Math.random()*c.items.length)|0,1)[0];it.st='dog';d.item=it;if(it.lab)it.lab.style.display='';d.st='flee';d.t=7;K.sfx('bark');K.msg('MUSTI VEI '+PROD[it.k].n.toUpperCase()+'!',1.6);const p=farFrom(c.x,c.z);d.tx=p.x;d.tz=p.z;}
    if(!c.items.length)d.st='wander';}
  else if(d.st==='flee'){spd*=1.05;if(d.t<=0||Math.hypot(d.x-d.tx,d.z-d.tz)<1){if(d.item){const it=d.item;d.item=null;it.st='floor';it.y=.05;}d.st='wander';d.t=3;}}
  else if(d.st==='scared'){const p=G.pl.reduce((a,b)=>Math.hypot(b.x-d.x,b.z-d.z)<Math.hypot(a.x-d.x,a.z-d.z)?b:a,G.pl[0]);tx=d.x+(d.x-p.x)*3;tz=d.z+(d.z-p.z)*3;spd*=1.1;if(d.t<=0){d.st='wander';d.t=2;}}
  if(d.st!=='dizzy'){const dx=tx-d.x,dz=tz-d.z,l=Math.hypot(dx,dz);if(l>.3){d.vx+=(dx/l*spd-d.vx)*Math.min(1,dt*6);d.vz+=(dz/l*spd-d.vz)*Math.min(1,dt*6);}else{d.vx*=.9;d.vz*=.9;}
    d.x+=d.vx*dt;d.z+=d.vz*dt;const h=pushOut(d,.4);if(h&&d.st==='wander')d.t=0;const v=Math.hypot(d.vx,d.vz);if(v>.2)d.face=Math.atan2(-d.vx,-d.vz);d.o.rotation.y=d.face;
    const k=Math.min(1,v/3);d.legs.forEach((L,i)=>L.rotation.x=Math.sin(performance.now()/60+(i%2?Math.PI:0))*.7*k);d.tail.rotation.z=Math.sin(performance.now()/70)*.6;}
  d.o.position.set(d.x,0,d.z);K.place(d.lab,d.o.position,1.1);}
function randFree(){for(let t=0;t<40;t++){const x=lerp(-W+2,W-2,Math.random()),z=lerp(-D+2,D-2,Math.random());if(!hitSolid(x,z,.6))return{x,z};}return{x:0,z:5};}
function farFrom(x,z){let best=null,bd=0;for(let t=0;t<20;t++){const p=randFree(),d=Math.hypot(p.x-x,p.z-z);if(d>bd){bd=d;best=p;}}return best;}
function updateCust(dt){for(const c of G.cust){c.t-=dt;if(c.t<=0){c.t=3+Math.random()*4;const p=randFree();c.tx=p.x;c.tz=p.z;}const dx=c.tx-c.x,dz=c.tz-c.z,l=Math.hypot(dx,dz);
  if(l>.4){c.vx=dx/l*1.1;c.vz=dz/l*1.1;}else{c.vx=c.vz=0;}c.x+=c.vx*dt;c.z+=c.vz*dt;pushOut(c,.4);for(const p of G.pl){const ex=p.x-c.x,ez=p.z-c.z,e=Math.hypot(ex,ez);if(e<.8&&e>0&&p.hold===null){p.x+=ex/e*(.8-e);p.z+=ez/e*(.8-e);}}
  if(l>.4)c.face=Math.atan2(-c.vx,-c.vz);c.o.position.set(c.x,0,c.z);c.o.rotation.y=c.face;CK.animBlob(c.o,dt,Math.hypot(c.vx,c.vz),false);}}
function say(p,t){if(!p)return;if(p.bubble)p.bubble.remove();p.bubble=K.label(t,'ckbubble');p.bubT=1.1;}
const floats=[];function floatText(t,pos){const el=K.label(t,'cklabel');el.style.color='#8df0a0';floats.push({el,p:pos.clone(),t:1.2});}
function endNight(){const N=G.N,m=Math.round(G.money);const stars=m>=N.goal*1.6?3:m>=N.goal*1.3?2:m>=N.goal?1:0;
  if(stars>0){K.unlock('n'+(G.n+1));if(K.players===1)K.unlock('solo');if(G.crashes===0)K.unlock('careful');if(stars===3)K.unlock('star3');}
  const pass=stars>0;const rows=[['Kassassa','€'+m],['Tavoite','€'+N.goal],['Törmäyksiä',String(G.crashes)],['Mummon listalta',String(G.listDone.length)]];
  K.results({title:pass?'Vuoro tehty!':'Kauppa sulkeutui…',stars,score:m,rows,text:pass?'Kauppias Ruusu on tyytyväinen. Melkein.':'Tavoite jäi saavuttamatta. Yritetään uudelleen!'});
  const allStars=NIGHTS.every((_,i)=>K.data.best[i]&&K.data.best[i].stars===3);if(allStars)K.unlock('starall');clearLevel();}
/* ================= kamera ja piirto ================= */
let shake=0;
K.loop((dt,rdt,T)=>{
  if(G&&K.state==='play')update(dt,T);
  // animaatiot ja kyltit
  if(G){for(const p of G.pl){p.o.position.set(p.x,0,p.z);p.o.rotation.y=p.face;CK.animBlob(p.o,rdt*(K.state==='play'?1:0),Math.hypot(p.vx,p.vz),!!p.carry);K.place(p.lab,p.o.position,1.7);if(p.bubble)K.place(p.bubble,p.o.position,2.3);}
    const c=G.cart;c.o.position.set(c.x,0,c.z);c.o.rotation.y=c.a;c.wheels.forEach(w=>w.rotation.x+=Math.hypot(c.vx,c.vz)*dt*6);
    for(const it of G.items)if(it.lab&&it.st!=='cart'){const want=G.list.includes(it.k)&&!G.listDone.includes(it.k);it.lab.classList.toggle('want',want);K.place(it.lab,it.o.position,.7);if(it.st==='carry'||(!want&&!G.pl.some(p=>Math.hypot(p.x-it.x,p.z-it.z)<7)))it.lab.style.display='none';}
    for(let i=floats.length-1;i>=0;i--){const f=floats[i];f.t-=rdt;f.p.y+=rdt*1.2;K.place(f.el,f.p,0);f.el.style.opacity=Math.min(1,f.t*2);if(f.t<=0){f.el.remove();floats.splice(i,1);}}
    let mx=0,mz=0;G.pl.forEach(p=>{mx+=p.x;mz+=p.z;});mx=(mx+c.x)/(G.pl.length+1);mz=(mz+c.z)/(G.pl.length+1);camT.x=lerp(camT.x,clamp(mx,-W+7,W-7),Math.min(1,rdt*3));camT.z=lerp(camT.z,clamp(mz,-D+4,D-3.5),Math.min(1,rdt*3));}
  else{camT.x=Math.sin(T*.08)*6;camT.z=Math.cos(T*.1)*2;}
  shake=Math.max(0,shake-rdt);const sx=(Math.random()-.5)*shake*.6,sz=(Math.random()-.5)*shake*.6;
  camera.position.set(camT.x+sx,G?13.5:22,camT.z+(G?9.5:13)+sz);camera.lookAt(camT.x,0,camT.z-.6);
});
K.menu();
</script>
